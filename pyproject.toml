[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pypi-publish"
version = "1.0.0"
description = "Internal PyPI publishing CLI with secure token management"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Ernie Butcher", email = "ernie@fiosii.com"},
]
dependencies = [
    "click>=8.0",
    "twine>=3.0",
    "build>=0.7",
]

[project.scripts]
pypi = "pypi_cli:cli"

[tool.setuptools]
py-modules = ["pypi_cli", "pypi_manager"]
